[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-features"
version = "0.1.0"
description = "Acoustic feature extraction (specan-compatible) shared by ML training and the inference API"
requires-python = ">=3.10,<3.12"
dependencies = [
    "numpy>=1.24,<2",
    "scipy>=1.11",
    "librosa>=0.10",
]

[tool.setuptools]
packages = ["voice_features"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning:librosa"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.isort]
known-first-party = ["voice_features", "data_preparation"]
