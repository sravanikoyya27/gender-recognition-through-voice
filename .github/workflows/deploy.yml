# CI/CD for Gender Recognition Through Voice.
#
#   pull_request -> main : backend tests (+ coverage gate), frontend lint/type-check/build
#   push         -> main : the same tests, then build + push images to ECR, then deploy to EC2
#   workflow_dispatch    : manual run; with `image_tag` set it redeploys an existing ECR tag
#                          (manual rollback) without re-testing or rebuilding
#
# Secrets (GitHub Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION   push to ECR / login on the instance
#   EC2_HOST, EC2_USER, EC2_PRIVATE_KEY                    SSH target (DEPLOY_USER overrides EC2_USER)
#   DEPLOY_USER                                            optional unix user for the deployment
#   SLACK_WEBHOOK_URL                                      optional incoming-webhook for notifications
#   CODECOV_TOKEN                                          optional coverage upload
# Variables (same page, "Variables" tab):
#   NEXT_PUBLIC_API_URL   public API URL baked into the frontend image (e.g. https://api.example.com)
#   DEPLOY_PATH           directory on the instance holding docker-compose.yml and .env (default below)
#   ECR_BACKEND_REPO / ECR_FRONTEND_REPO   repository names (default voice-backend / voice-frontend)

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing ECR image tag (commit SHA) to deploy. Leave empty for a normal run."
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a deployment half-way

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"
  ECR_BACKEND_REPO: ${{ vars.ECR_BACKEND_REPO || 'voice-backend' }}
  ECR_FRONTEND_REPO: ${{ vars.ECR_FRONTEND_REPO || 'voice-frontend' }}

jobs:
  # ---------------------------------------------------------------------------
  # a) Backend tests (all branches)
  # ---------------------------------------------------------------------------
  backend-tests:
    name: Backend tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Lets test_migrations.py run against a real PostgreSQL (it skips when unreachable).
      DATABASE_URL: postgresql+psycopg2://voice:voice@localhost:5432/voice_gender
      JWT_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: voice
          POSTGRES_PASSWORD: voice
          POSTGRES_DB: voice_gender
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U voice -d voice_gender"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            ml_models/requirements.txt

      - name: Install system dependencies (libsndfile for audio decoding)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsndfile1

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt # includes the shared feature package (-e ../ml_models)

      # The trained model, scaler and manifest are not tracked by git (see .gitignore). They are
      # restored from the Actions cache and otherwise regenerated with the real Phase 2 pipeline
      # (voice.csv download -> MLP + scikit-learn training -> comparison -> deployment copy).
      - name: Restore model artifacts
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            backend/app/ml/models
            ml_models/models
            ml_models/data/processed/voice_csv
          key: model-artifacts-${{ runner.os }}-${{ hashFiles('ml_models/*.py', 'ml_models/voice_features/**', 'ml_models/requirements.txt') }}

      - name: Train and deploy model artifacts (cache miss)
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: ml_models
        run: |
          pip install -r requirements.txt
          python prepare_voice_csv.py
          python train_neural_network.py --data-dir data/processed/voice_csv --output models
          python train_sklearn_models.py --data-dir data/processed/voice_csv --output models/sklearn
          python model_comparison.py --models-dir models --data-dir data/processed/voice_csv \
            --output models/comparison --deploy-dir ../backend/app/ml/models

      - name: Run pytest with coverage (fails below 80 %)
        run: |
          pytest backend/tests/ --cov=app --cov-report=term-missing --cov-report=xml:coverage.xml \
            --cov-fail-under=80

      - name: Upload coverage to Codecov (optional)
        if: env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v4
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Share model artifacts with the image build
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          retention-days: 7
          if-no-files-found: error
          path: |
            backend/app/ml/models/model_mlp.h5
            backend/app/ml/models/scaler_mlp.pkl
            backend/app/ml/models/model_config.json
            ml_models/models/metrics_mlp.json
            ml_models/models/comparison/comparison_report.json
            ml_models/models/sklearn/feature_importance.json

  # ---------------------------------------------------------------------------
  # b) Frontend checks (all branches)
  # ---------------------------------------------------------------------------
  frontend-tests:
    name: Frontend tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Clean install
        run: npm ci --legacy-peer-deps # react-mic 12.4.6 declares a React 16 peer

      - name: ESLint
        run: npm run lint

      - name: Strict TypeScript
        run: npm run type-check

      - name: Production build
        run: npm run build

      # No frontend unit-test runner is configured yet (frontend/__tests__ is empty);
      # --if-present keeps this honest instead of faking a passing "test" script.
      - name: Unit tests (when a test script exists)
        run: npm test --if-present

  # ---------------------------------------------------------------------------
  # c) Build and push Docker images (main branch only)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and push images
    needs: [backend-tests, frontend-tests]
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.image_tag == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      registry: ${{ steps.ecr.outputs.registry }}
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download model artifacts produced by the test job
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/Dockerfile.frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ---------------------------------------------------------------------------
  # d) Deploy to EC2 (main branch only, after a successful build; or manual rollback)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: [build-and-push]
    if: ${{ always() && github.ref == 'refs/heads/main' && (needs.build-and-push.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.image_tag != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_API_URL }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/voice-gender' }}
      SSH_USER: ${{ secrets.DEPLOY_USER || secrets.EC2_USER }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy compose file and deploy script to the instance
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: infrastructure/docker-compose.yml,infrastructure/deploy.sh
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Pull images, migrate, restart, health-check (rolls back on failure)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          command_timeout: 25m
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,ECR_REGISTRY,IMAGE_TAG,DEPLOY_PATH,ECR_BACKEND_REPO,ECR_FRONTEND_REPO
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            chmod +x deploy.sh
            ./deploy.sh deploy "$IMAGE_TAG"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}

      - name: Notify Slack (success)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK_URL" --data @- <<EOF
          {"text": ":white_check_mark: Deployed *${{ github.repository }}* tag \`${IMAGE_TAG}\` to ${{ secrets.EC2_HOST }} (${{ github.event_name }} by ${{ github.actor }})\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          EOF

      - name: Notify Slack (failure)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK_URL" --data @- <<EOF
          {"text": ":x: Deployment of *${{ github.repository }}* tag \`${IMAGE_TAG}\` FAILED (previous images restored where possible)\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          EOF
