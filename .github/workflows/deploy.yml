# Release: build and publish the Docker images to ECR and (optionally) deploy to EC2.
#
# MANUAL ONLY (workflow_dispatch). Nothing here runs on push or pull request; automatic testing
# lives in ci.yml. Two modes, chosen by the inputs:
#
#   image_tag empty   -> run the CI tests (reused from ci.yml), build both images for this commit,
#                        push them to ECR tagged with the commit SHA (and `latest`), then deploy
#                        only if `deploy` is true.
#   image_tag = <sha> -> ROLLBACK / REDEPLOY: no tests, no build, no push. The existing ECR
#                        images with that tag are deployed, only if `deploy` is true.
#
# `deploy` defaults to false, so a release never reaches EC2 unless explicitly requested. The
# deploy job also runs in the `production` environment: add required reviewers to that
# environment (Settings -> Environments) for a second, approval-based gate.
#
# Secrets (GitHub Settings -> Secrets and variables -> Actions):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION   push to ECR / login on the instance
#   EC2_HOST, EC2_USER, EC2_PRIVATE_KEY                    SSH target (DEPLOY_USER overrides EC2_USER)
#   DEPLOY_USER                                            optional unix user for the deployment
#   SLACK_WEBHOOK_URL                                      optional incoming-webhook for notifications
# Variables (same page, "Variables" tab):
#   NEXT_PUBLIC_API_URL   public API URL baked into the frontend image (e.g. https://api.example.com)
#   DEPLOY_PATH           directory on the instance holding docker-compose.yml and .env (default below)
#   ECR_BACKEND_REPO / ECR_FRONTEND_REPO   repository names (default voice-backend / voice-frontend)

name: Release

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Rollback/redeploy: existing ECR image tag (commit SHA). Leave EMPTY to build and push this commit."
        required: false
        default: ""
      deploy:
        description: "Deploy to EC2 (after the build, or the given image_tag). Off by default."
        type: boolean
        required: false
        default: false

concurrency:
  group: release
  cancel-in-progress: false # never cancel a release or deployment half-way

env:
  ECR_BACKEND_REPO: ${{ vars.ECR_BACKEND_REPO || 'voice-backend' }}
  ECR_FRONTEND_REPO: ${{ vars.ECR_FRONTEND_REPO || 'voice-frontend' }}

jobs:
  # ---------------------------------------------------------------------------
  # 0) Preflight: are the deployment secrets configured? (names only, never values)
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight (secrets and inputs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_PRIVATE_KEY: ${{ secrets.EC2_PRIVATE_KEY }}
      SSH_USER: ${{ secrets.DEPLOY_USER || secrets.EC2_USER }}
      IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
      DEPLOY_INPUT: ${{ inputs.deploy }}
    steps:
      - name: Validate inputs
        run: |
          if [ -n "$IMAGE_TAG_INPUT" ] && ! printf '%s' "$IMAGE_TAG_INPUT" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::image_tag must be a commit SHA (7-40 hex characters) of an existing ECR image."
            exit 1
          fi
          if [ -n "$IMAGE_TAG_INPUT" ]; then
            echo "Mode: ROLLBACK / REDEPLOY of existing tag $IMAGE_TAG_INPUT (no build, no push)"
          else
            echo "Mode: BUILD AND PUSH commit ${GITHUB_SHA} (tests run first)"
          fi
          echo "Deploy to EC2: $DEPLOY_INPUT"

      - name: Check required secrets are present (values are never printed)
        run: |
          missing=""
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION; do
            [ -z "${!name}" ] && missing="$missing $name"
          done
          if [ "$DEPLOY_INPUT" = "true" ]; then
            for name in EC2_HOST EC2_PRIVATE_KEY; do
              [ -z "${!name}" ] && missing="$missing $name"
            done
            [ -z "$SSH_USER" ] && missing="$missing EC2_USER(or DEPLOY_USER)"
          fi
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Add them under Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi
          echo "All required secrets are configured."

  # ---------------------------------------------------------------------------
  # 1) Tests (reused from ci.yml, same run -> artifacts shared). Skipped for rollbacks.
  # ---------------------------------------------------------------------------
  tests:
    name: Tests
    needs: preflight
    if: ${{ inputs.image_tag == '' }}
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 2) Build and push images for this commit. Never runs when redeploying an existing tag.
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build and push images
    needs: [preflight, tests]
    if: ${{ inputs.image_tag == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download model artifacts produced by the test job
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: .

      - name: Verify model artifacts
        run: |
          ls -l backend/app/ml/models/model_mlp.h5 backend/app/ml/models/scaler_mlp.pkl \
            backend/app/ml/models/model_config.json ml_models/models/comparison/comparison_report.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/Dockerfile.backend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_BACKEND_REPO }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/Dockerfile.frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8000' }}
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_FRONTEND_REPO }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

  # ---------------------------------------------------------------------------
  # 3) Deploy to EC2: only when `deploy` is true, after a successful build or for an existing tag.
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to EC2
    needs: [preflight, tests, build-and-push]
    # always() lets this job evaluate when tests/build were skipped (rollback mode); the
    # conditions then require preflight to have passed and either a fresh successful build
    # or an explicit existing image_tag.
    if: >-
      ${{ always()
          && inputs.deploy == true
          && needs.preflight.result == 'success'
          && ((inputs.image_tag == '' && needs.build-and-push.result == 'success')
              || inputs.image_tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_API_URL }}
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/voice-gender' }}
      SSH_USER: ${{ secrets.DEPLOY_USER || secrets.EC2_USER }}
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Copy compose file and deploy script to the instance
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: infrastructure/docker-compose.yml,infrastructure/deploy.sh
          target: ${{ env.DEPLOY_PATH }}
          strip_components: 1
          overwrite: true

      - name: Pull images, migrate, restart, health-check (rolls back on failure)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          command_timeout: 25m
          envs: AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_REGION,ECR_REGISTRY,IMAGE_TAG,DEPLOY_PATH,ECR_BACKEND_REPO,ECR_FRONTEND_REPO
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            chmod +x deploy.sh
            ./deploy.sh deploy "$IMAGE_TAG"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}

      - name: Notify Slack (success)
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK_URL" --data @- <<EOF
          {"text": ":white_check_mark: Deployed *${{ github.repository }}* tag \`${IMAGE_TAG}\` to ${{ secrets.EC2_HOST }} (release by ${{ github.actor }})\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          EOF

      - name: Notify Slack (failure)
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -sS -X POST -H 'Content-type: application/json' "$SLACK_WEBHOOK_URL" --data @- <<EOF
          {"text": ":x: Deployment of *${{ github.repository }}* tag \`${IMAGE_TAG}\` FAILED (previous images restored where possible)\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
          EOF
